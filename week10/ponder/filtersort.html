
<html>
  <head>
    <title>Sorting Activities</title>
    <script defer src="filtersort.js"></script>
    <link rel="stylesheet" href="filtersort.css">
  </head>
  <body>
    
    <div class="entire-container">
        <label for="search">Enter Search</label>
        <input id="search" type="text">
        <button>Search</button>
        
        <div id="hike-container">
          <div class="hike-card">
            <div class="hike-content">
              <h2>Teton Canyon</h2>
              <div class="hike-tags">
                <button class="button">Canyon</button>
                <button class="button">Tetons</button>
              </div>
              <p>Beautiful short (or long) hike through Teton Canyon.</p>
              <p><span class="rating" role="img" aria-label="1 out of 5">🥾</span></p>
            </div>
          </div>
        </div>
    </div>
  </body>
</html>
