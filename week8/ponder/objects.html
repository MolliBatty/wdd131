<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects Demo</title>
    <script src="objects.js" defer></script>
    <link rel="stylesheet" href="objects.css">
</head>
<body>
    <header>
        <img src="byui-logo-blue.webp" alt="byui">
    </header>
    <div class="container">
        <h1 id="courseName"></h1>
        <h2 id="courseCode"></h2>
        <label for="sectionNumber">Section Number</label>
        <input id="sectionNumber" />
        <button id="enrollStudent">Enroll Student</button>
        <hr>
        <table>
            <thead>
                <tr>
                    <th>Section#</th>
                    <th>Room#  #Enrolled</th>
                    <th>Days</th>
                    <th>Instructor</th>
                </tr>
            </thead>
            <tbody id="sections"></tbody>
        </table>
    </div>
          
</body>
</html>
