<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Form</title>
    <link rel="stylesheet" href="creditcard.css">
    <script src="creditcard.js" defer></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">
</head>
<body>
    <main>
        <form id="creditcardform" action="completed.html" method="get">
            <div id="frontcard">
                <p class="total">TOTAL: $199</p>
                <label for="cardnumber">CARD NUMBER</label>
                <input type="text" id="cardnumber" name="number" placeholder="1234 1234 1234 1234">
                <label for="holder">CARD HOLDER</label>
                <input type="text" id="holder" name="holder" placeholder="John Doe">
                <label id="expirationDate">EXPIRATION</label>
                <div id="cardExpiration">
                    <input type='text' id='month' name="expMonth" placeholder="MM" aria-labelledby="expirationDate">
                    <input type='text' id='year' name="expYear" placeholder="YY" aria-labelledby="expirationDate">
                </div>
            </div>
            <div id="backcard">
                <div id="blackstrip"></div>
                <label for="cvc-cvv">CVC/CVV</label>
                <input type="text" id="cvc-cvv" name="securitycode" placeholder="XXX">
            </div>
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
